;15.기타(다중운집인파사고, 인공우주물체 추락·충돌)&lt;/td&gt;&lt;td class=n&gt;0.8%&lt;/td&gt;&lt;td class=n&gt;0.8%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;18.치안 및 기타&lt;/td&gt;&lt;td class=n&gt;0.4%&lt;/td&gt;&lt;td class=n&gt;0.8%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;h3&gt;Q30. 우리 사회의 잠재적 위험요인 (자유응답) &lt;small&gt;(응답 542건)&lt;/small&gt;&lt;/h3&gt;&lt;p class=mean&gt;빈출 키워드: 기후(201) · 변화로(183) · 잠재적(134) · 날씨가(125) · 걱정됩니다(122) · 사이버(113) · 범죄가(95) · 갑자기(93) · 보이스피싱(91) · 위험요인이라고(81) · 사고가(78) · 예측(77) · 국지성(71) · 불가능한(68) · 기술이(67) · 기상(66) · 혼자(65) · 위험이(64) · 노후화된(59) · 새로운(58)&lt;/p&gt;&lt;ul class=open&gt;&lt;li&gt;요즘 AI 기술이 발달하면서 딥페이크 같은 디지털 성범죄가 많이 발생하고 있는데, 이걸 재난으로 관리해야 할 것 같아요. 그리고 기후변화 때문에 여름 폭염이 너무 심해져서 실외 활동이 불가능해지는 것도 위험요인인 것 같아요.&lt;/li&gt;&lt;li&gt;최근 날씨가 이상해서 여름철에 장마가 오면 동네 저지대가 침수되거나 산사태가 날까 봐 걱정됩니다. 그리고 공장 기계들이 점점 낡아가는데 가스가 새거나 고장 나서 사고가 나지 않을까 하는 불안도 듭니다.&lt;/li&gt;&lt;li&gt;최근 날씨가 너무 덥고 태풍도 자주 온다니, 앞으로 더 큰 홍수나 폭염 같은 게 사람들의 건강을 해치지 않을까 걱정됩니다. 그리고 우리 아파트도 노후화되어서 화재나 가스 사고 같은 게 나면 정말 큰일 날 것 같아요.&lt;/li&gt;&lt;li&gt;기후 변화로 인해 예측하기 힘든 집중호우와 태풍이 점점 강해지고 있어, 이로 인한 도시 침수와 산사태 위험이 가장 걱정됩니다. 또한 노후화된 아파트와 주택 시설에서 발생할 수 있는 가스나 화재 사고도 선제적으로 관리되어야 한다고 생각합니다.&lt;/li&gt;&lt;li&gt;요즘 유튜브나 뉴스에서 보면 AI 기술을 이용한 보이스피싱이나 딥페이크 같은 사이버 범죄가 너무 정교해져서 일반인은 속출 수가 없을 것 같아요. 그리고 우리 동네처럼 오래된 주택이나 상가가 많은 곳은 낡은 전기 배선 때문에 화재가 날까 봐 항상 조심스럽더라고요.&lt;/li&gt;&lt;li&gt;최근 뉴스에서 많이 보는 보이스피싱 같은 범죄 수법이 점차 정교해져서 걸러내기 어려워 보이는 점이 걱정되고, 아이들이 먹는 가공식품에 포함된 미세 플라스틱이나 화학 물질 같은 눈에 보이지 않는 위해 요소들이 위험해 보입니다.&lt;/li&gt;&lt;li&gt;요즘 날씨가 너무 덥거나 비가 갑자기 쏟아져서 농사짓는 데 많은 지장을 주는데, 이런 기상 이변을 미리 알릴 수 있는 기술이 더 있었으면 좋겠습니다. 그리고 우리 동네는 집이 낡고 골목이 좁아서 화재가 나면 소방차가 들어오기 힘든데, 그런 위험을 미리 막을 수 있는 방법도 필요하다고 봅니다.&lt;/li&gt;&lt;li&gt;요즘 기후 변화로 예전보다 장마철 비가 너무 많이 와서 지리산 인근 산사태 위험이 커지는 것 같습니다. 또한 우리 동네는 고령자 분들이 많으셔서 큰 재난이 발생하면 빠르게 대피하기 힘들지도 모른다는 걱정이 듭니다.&lt;/li&gt;&lt;li&gt;기후 변화로 인한 집중호우와 도심 홍수, 그리고 노후화된 아파트 단지의 가스 및 전기 설비 사고가 잠재적 위험요인이라고 생각합니다. 또한, 고령화 사회로 진입함에 따라 의약품 오남용이나 안전 취약계층을 위한 복지 시설의 안전 관리도 중요해질 것 같습니다.&lt;/li&gt;&lt;li&gt;날씨가 점점 이상해져서 태풍이나 폭우 같은 게 예전보다 더 위험해질 것 같고, 요즘 핸드폰으로 하루 종일 뉴스를 보니 AI 딥페이크 같은 기술을 악용한 사기 범죄도 재난급으로 관리가 필요해 보입니다.&lt;/li&gt;&lt;li&gt;고령화와 디지털 기술의 발전으로 인해 AI 기반의 보이스피싱이나 사이버 테러 같은 새로운 형태의 사회재난이 증가할 것입니다. 또한 노후화된 도시 기반시설과 기후 변화에 따른 국지적 호우로 인한 지반 침하 같은 도시형 재난도 정부가 선제적으로 관리해야 할 잠재적 위험요인입니다.&lt;/li&gt;&lt;li&gt;최근 기후 변화로 인한 예측 불가능한 국지성 호우와 폭염이 도시 기반 시설을 견디지 못하고 발생하는 이상 기후 재난이 가장 우려되며, 고령화 사회에서 독거 노인이나 안전 취약 계층을 위한 실질적인 재난 대응 시스템이 부족한 점도 잠재적 위험요인이라고 생각합니다.&lt;/li&gt;&lt;li&gt;최근 기후 변화로 인한 예측 불가능한 폭우나 폭염이, 야외에서 일하는 저와 같은 사람들에게는 가장 큰 잠재적 위험요인으로 다가옵니다. 또한 고령화 사회로 접어들면서 재난 상황 발생 시 대피가 어려운 독거 어르신들에 대한 선제적인 보호 대책도 사회적 차원에서 재난으로 관리되어야 한다고 생각합니다.&lt;/li&gt;&lt;li&gt;최근 기후 변화로 인해 예측하기 힘든 국지성 호우나 폭염이 자주 발생하고 있어서 이에 대한 대비가 시급하다고 생각합니다. 또한, 고령화로 인해 건강 관련 문제가 커지는 만큼 신종 바이러스나 전염병 같은 보건 위험 요인도 재난 차원에서 더 철저히 관리해야 한다고 봅니다.&lt;/li&gt;&lt;li&gt;동네가 낡아서 전기나 가스 설비 노후화로 인한 화재가 걱정되고, 요즘 같은 폭염에는 냉방비 부담도 크고 건강도 해칠까 봐 겁납니다.&lt;/li&gt;&lt;li&gt;최근 기후 변화로 인해 예측하기 힘든 국지성 호우나 폭염 같은 이상 기후 현상이 점점 잦아지고 있어서 이를 새로운 잠재적 위험요인으로 생각합니다. 또한 일상생활에서 빼놓을 수 없는 인공지능이나 IT 기술의 오작동, 혹은 그로 인한 사이버 보안 문제도 앞으로 중요한 위험 요소가 될 것 같아요.&lt;/li&gt;&lt;li&gt;스마트 팩토리와 자동화 시스템의 의존도가 높아짐에 따라, 사이버 테러나 AI 시스템의 오작동으로 인한 대규모 산업 재해 및 정보 유출이 잠재적 위험요인이라고 생각합니다.&lt;/li&gt;&lt;li&gt;요즘 날씨가 이상해서 장마철이 아닌데도 갑자기 폭우가 쏟아져 도로가 침수되거나 산사태가 나는 것이 자주 발생하는데, 이런 기상 이변으로 인한 사고가 더 위험해지는 것 같습니다. 또 요즘은 인터넷과 스마트폰을 이용한 보이스피싱이나 사기가 너무 교묘해져서 정보에 약한 어르신들이 큰 피해를 입는 것도 사회적 재난이라고 생각합니다.&lt;/li&gt;&lt;li&gt;기후 변화로 인한 해안 침수와 같은 지역적 재난 위험 증가와, 현대 사회의 고립감과 스트레스가 초래하는 집단 심리 위기가 향후 중요한 관리 대상이 될 것이라고 생각합니다.&lt;/li&gt;&lt;li&gt;급격한 기후 변화로 인한 예측 불가능한 기상 이변과, 최 developments 인공지능 기술을 악용한 고도화된 사이버 범죄나 딥페이크 같은 신종 범죄가 가장 잠재적인 위험요인이라고 생각합니다.&lt;/li&gt;&lt;/ul&gt;
&lt;h2&gt;교차분석 (1·2차 종합)&lt;/h2&gt;&lt;h3&gt;Q6 심각성 — 연령대&lt;/h3&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;구분&lt;/th&gt;&lt;th&gt;가중평균&lt;/th&gt;&lt;th&gt;n&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;19-29&lt;/td&gt;&lt;td class=n&gt;4.00&lt;/td&gt;&lt;td class=n&gt;88&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;30-39&lt;/td&gt;&lt;td class=n&gt;4.02&lt;/td&gt;&lt;td class=n&gt;105&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;40-49&lt;/td&gt;&lt;td class=n&gt;4.04&lt;/td&gt;&lt;td class=n&gt;107&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;50-59&lt;/td&gt;&lt;td class=n&gt;4.03&lt;/td&gt;&lt;td class=n&gt;128&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;60-69&lt;/td&gt;&lt;td class=n&gt;4.01&lt;/td&gt;&lt;td class=n&gt;114&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;h3&gt;Q14 기술인지 — 연령대&lt;/h3&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;구분&lt;/th&gt;&lt;th&gt;가중평균&lt;/th&gt;&lt;th&gt;n&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;19-29&lt;/td&gt;&lt;td class=n&gt;2.11&lt;/td&gt;&lt;td class=n&gt;88&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;30-39&lt;/td&gt;&lt;td class=n&gt;2.19&lt;/td&gt;&lt;td class=n&gt;105&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;40-49&lt;/td&gt;&lt;td class=n&gt;2.33&lt;/td&gt;&lt;td class=n&gt;107&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;50-59&lt;/td&gt;&lt;td class=n&gt;2.11&lt;/td&gt;&lt;td class=n&gt;128&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;60-69&lt;/td&gt;&lt;td class=n&gt;1.89&lt;/td&gt;&lt;td class=n&gt;114&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;h3&gt;Q16 해결가능성 — 학력&lt;/h3&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;구분&lt;/th&gt;&lt;th&gt;가중평균&lt;/th&gt;&lt;th&gt;n&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;고졸 이하&lt;/td&gt;&lt;td class=n&gt;3.01&lt;/td&gt;&lt;td class=n&gt;272&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;대학교 졸업&lt;/td&gt;&lt;td class=n&gt;3.04&lt;/td&gt;&lt;td class=n&gt;241&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;대학원 졸업&lt;/td&gt;&lt;td class=n&gt;3.16&lt;/td&gt;&lt;td class=n&gt;29&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;h3&gt;Q28 지역안전도 — 지역&lt;/h3&gt;&lt;table&gt;&lt;t &lt;h1&gt;실제 대국민조사 vs Nemotron 가상 설문조사 — 비교·분석 리포트&lt;/h1&gt;
&lt;div class=note&gt;
&lt;b&gt;비교 대상&lt;/b&gt;&lt;br&gt;
① &lt;b&gt;실제 조사&lt;/b&gt;: 「재난안전기술 대국민 인식조사」(국립재난안전연구원 등) — 전국 만 19~69세 1,023명, 구조화 질문지 온라인 조사(2025.08.18~09.05), 95% 신뢰수준 ±3.06%p&lt;br&gt;
② &lt;b&gt;가상 조사&lt;/b&gt;: NVIDIA Nemotron-Personas-Korea 합성 페르소나 542명에게 동일 문항(Q5~Q30)을 zai-glm-4.7 LLM이 1인칭 응답 → 동일한 사후층화 가중치 적용&lt;br&gt;
※ 두 조사 모두 동일 설문지·동일 모집단(2025년 주민등록인구)·동일 가중 방식. 따라서 &lt;b&gt;차이의 원인은 &quot;응답 주체(실제 인간 vs LLM 페르소나)&quot;로 귀속&lt;/b&gt;됩니다.
&lt;/div&gt;

&lt;div class=warn&gt;
&lt;b&gt;한 줄 결론&lt;/b&gt; — 가상조사는 &lt;b&gt;평균적 태도·정보경로·인지수준 등 &quot;분포의 중심&quot;은 실제와 상당히 근접&lt;/b&gt;하게 재현했으나,
&lt;b&gt;① 응답 분산이 극단적으로 축소(소수의견 소멸)&lt;/b&gt;되고 &lt;b&gt;② 최신 사건 기억·자기지역 낙관편향 등 &quot;인간 특유의 인지&quot;를 재현하지 못했으며&lt;/b&gt;
&lt;b&gt;③ 긍정·모범답안 방향으로 체계적 쏠림&lt;/b&gt;이 관찰되었습니다.

&lt;h2&gt;4. 차이의 원인 분석 — 6가지 메커니즘&lt;/h2&gt;

&lt;div class=key&gt;&lt;b&gt;① 응답 분산의 극단적 축소 (Mode-seeking / 소수의견 소멸)&lt;/b&gt;&lt;br&gt;
가장 두드러진 패턴. LLM은 페르소나가 달라도 &quot;가장 그럴듯한 단일 답&quot;으로 수렴한다(temperature 0.7로도 다양성 부족).
&lt;ul&gt;
&lt;li&gt;Q12 인명피해: 실제 62.9% → 가상 &lt;b&gt;100%&lt;/b&gt; (나머지 5개 기준 완전 소멸)&lt;/li&gt;
&lt;li&gt;Q27 예측·예방: 실제 55.6% → 가상 &lt;b&gt;99.4%&lt;/b&gt;&lt;/li&gt;
&lt;li&gt;Q6 심각성·Q16 해결가능: 실제는 1~5점에 퍼지나, 가상은 한 점(보통/심각)에 96~99% 집중&lt;/li&gt;
&lt;/ul&gt;
→ 실제 인간 집단의 &lt;b&gt;의견 다양성·꼬리분포(소수 의견)를 재현하지 못함&lt;/b&gt;. 평균은 맞아도 분포 모양이 다르다.&lt;/div&gt;

&lt;div class=key&gt;&lt;b&gt;② 최신 사건 기억의 부재·왜곡 (지식 컷오프 / 환각)&lt;/b&gt;&lt;br&gt;
Q7에서 실제 1위 &#x27;제주항공 참사&#x27;(2024.12)는 가상에서 5.7%로 추락하고, &#x27;전기차 화재&#x27;가 51.9%로 1위가 됨.
LLM은 페르소나의 실제 체험·기억이 없고, 학습 컷오프 이후의 충격적 사건에 인간처럼 가중치를 두지 못한다.
→ &lt;b&gt;&quot;가장 최근·가장 충격적 사건&quot;에 대한 인간의 회상 편향(recency/salience)을 재현하지 못함.&lt;/b&gt;&lt;/div&gt;

&lt;div class=key&gt;&lt;b&gt;③ 코드표 상의 직관적·전형적 항목 쏠림&lt;/b&gt;&lt;br&gt;
Q9(사회재난)에서 실제 1위 &#x27;감염병&#x27;(코로나 경험 기반)이 가상에서는 &#x27;화재&#x27; 73%에 압도됨. Q10도 &#x27;범죄&#x27;→&#x27;승강기&#x27;로 역전.
LLM은 정서적·경험적 무게보다 &lt;b&gt;&quot;재난=화재·승강기&quot; 같은 전형적 연상&lt;/b&gt;에 끌린다.
→ 인간의 &lt;b&gt;집합적 트라우마(팬데믹)·뉴스 노출에 의한 위험 가중&lt;/b&gt;을 과소반영.&lt;/div&gt;

&lt;div class=key&gt;&lt;b&gt;④ 자기지역 낙관편향(home bias)의 미재현&lt;/b&gt;&lt;br&gt;
Q29에서 실제 응답자는 72.5%가 &quot;내 지역이 더 안전&quot;이라 답하는 강한 낙관편향을 보이나, 가상은 48.8%로 거의 중립(50:50).
LLM은 자기 거주지에 대한 &lt;b&gt;인간 특유의 정서적 방어·낙관&lt;/b&gt;을 갖지 않고 균형 잡힌 판단을 한다.
→ 태도형 문항에서 &lt;b&gt;인간의 동기적 편향(motivated reasoning)을 결여.&lt;/b&gt;&lt;/div&gt;

&lt;div class=key&gt;&lt;b&gt;⑤ 사회적 바람직성·긍정 동의 편향 (Acquiescence)&lt;/b&gt;&lt;br&gt;
R&amp;amp;D 중요성(Q17)·투자필요성(Q19)에서 가상은 4.7~4.8로, 실제(4.1~4.2)보다 체계적으로 높다.
LLM은 &quot;중요한가/필요한가&quot;류 문항에 &lt;b&gt;더 강하게 동의하는 경향&lt;/b&gt;이 있다.
→ 정책 지지·규범적 문항에서 &lt;b&gt;지지율을 과대추정&lt;/b&gt;할 위험.&lt;/div&gt;

&lt;div class=key&gt;&lt;b&gt;⑥ 표본 구성(학력)의 구조적 차이&lt;/b&gt;&lt;br&gt;
실제는 온라인패널 특성상 대졸+ 88.7%인 반면, 가상은 Nemotron 자연분포로 고졸이하 50%.
학력은 층화·가중 변수가 아니라 이 차이가 가중 후에도 남아, 학력 연동 문항(기술 인지도·정보탐색 등)에 일부 영향.
→ 단, 본 조사의 &lt;b&gt;주요 차이는 학력보다 ①~⑤의 &quot;LLM 응답 특성&quot;에서 기인&lt;/b&gt;.&lt;/div&gt;

&lt;h2&gt;5. 종합 평가 — 무엇을 신뢰할 수 있나&lt;/h2&gt;
&lt;table&gt;
&lt;tr&gt;&lt;th&gt;활용 목적&lt;/th&gt;&lt;th&gt;가상조사 신뢰도&lt;/th&gt;&lt;th&gt;근거&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;전반적 태도·평균 수준&lt;/b&gt; 파악&lt;br&gt;(관심도·효과성·안전성·인지도)&lt;/td&gt;&lt;td class=match&gt;높음 ✔&lt;/td&gt;&lt;td&gt;Q5·Q14·Q18·Q28·Q15가 실제와 근접. 분포 중심은 잘 재현&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;상위 우선순위 항목&lt;/b&gt; 식별&lt;br&gt;(정보경로·기여단계 방향)&lt;/td&gt;&lt;td class=mid&gt;중간 △&lt;/td&gt;&lt;td&gt;1~2위 항목은 자주 겹치나 비율이 과장됨. 순위는 참고 가능, 수치는 불가&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;의견 분포·소수의견·하위집단 차이&lt;/b&gt;&lt;/td&gt;&lt;td class=gap&gt;낮음 ✘&lt;/td&gt;&lt;td&gt;분산이 소멸해 다양성·꼬리분포·집단 간 미세차이 신뢰 불가&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;최신 사건 관련 응답&lt;/b&gt; (Q7 등)&lt;/td&gt;&lt;td class=gap&gt;낮음 ✘&lt;/td&gt;&lt;td&gt;지식 컷오프·기억 부재로 실제와 1위가 뒤바뀜&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;태도형 편향 문항&lt;/b&gt; (자기지역·정책지지)&lt;/td&gt;&lt;td class=gap&gt;낮음 ✘&lt;/td&gt;&lt;td&gt;인간 특유의 낙관·동의 편향을 재현/과대&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

&lt;div class=warn&gt;
&lt;b&gt;결론 및 시사점&lt;/b&gt;&lt;br&gt;
Nemotron 가상 설문은 &lt;b&gt;&quot;여론의 평균적 무게중심&quot;을 빠르고 저렴하게 근사&lt;/b&gt;하는 데에는 유효하다(Q15·Q18·Q28 등 다수 항목이 ±0.1~0.3 이내로 일치).
그러나 &lt;b&gt;① 의견의 다양성, ② 최신 사건 인지, ③ 인간 특유의 인지편향&lt;/b&gt;이 결정적인 문항에서는 실제와 체계적으로 어긋난다.
따라서 가상조사는 &lt;b&gt;실제 설문의 대체재가 아니라, 사전 파일럿·문항 검증·가설 생성·저비용 1차 스캐닝용 보완재&lt;/b&gt;로 활용하는 것이 적절하다.
정량적 의사결정(예: 정책 지지율, 우선순위 예산배분)에는 반드시 실제 조사로 검증이 필요하다.
&lt;/div&gt;

&lt;h2&gt;6. 가상조사를 실제에 근접시키는 방법&lt;/h2&gt;
&lt;p&gt;위 6가지 차이 원인별 대응책을 &lt;b&gt;효과 대비 비용&lt;/b&gt; 순으로 정리한다.&lt;/p&gt;

&lt;h3&gt;즉시 적용 가능 (저비용, 본 코드베이스에서)&lt;/h3&gt;
&lt;table&gt;
&lt;tr&gt;&lt;th&gt;방법&lt;/th&gt;&lt;th&gt;대상 원인&lt;/th&gt;&lt;th&gt;구현&lt;/th&gt;&lt;th&gt;기대효과&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;① 응답 다양성 상향&lt;/b&gt;&lt;/td&gt;&lt;td&gt;①분산 소멸&lt;/td&gt;&lt;td&gt;&lt;code&gt;temperature 0.7→0.9~1.1&lt;/code&gt; + &lt;code&gt;top_p&lt;/code&gt; 추가, 프롬프트에 &quot;교과서적 정답이 아니라 비전형적·솔직한 답을 고르라, 남과 달라도 좋다&quot; 지시 강화&lt;/td&gt;&lt;td class=match&gt;Q12·Q27 극단 쏠림 완화&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;② 최신 사건 팩트 브리핑&lt;/b&gt;&lt;/td&gt;&lt;td&gt;②기억 부재&lt;/td&gt;&lt;td&gt;프롬프트에 2024년 실제 재난(제주항공 참사 등) 시점·규모 맥락 주입(간이 RAG)&lt;/td&gt;&lt;td class=match&gt;Q7 1위 역전 교정&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;③ 거주지 위험 맥락 주입&lt;/b&gt;&lt;/td&gt;&lt;td&gt;③전형 쏠림·④낙관&lt;/td&gt;&lt;td&gt;시도별 실제 위험요인(해안=해양재난, 도시=인파 등)을 페르소나 프롬프트에 추가&lt;/td&gt;&lt;td class=mid&gt;Q28·Q29 개선&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

&lt;h3&gt;중간 비용&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;④ 다중 추출 + 분포 보존&lt;/b&gt; — 페르소나 1명당 여러 번 응답시켜 개인 내 확률분포를 보존(현재는 1회 결정적 추출). 토큰 비용 증가&lt;/li&gt;
&lt;li&gt;&lt;b&gt;⑤ 표본 확대&lt;/b&gt; — 542명 → 증대. 단 일일 토큰 한도가 병목&lt;/li&gt;
&lt;/ul&gt;

&lt;h3&gt;고비용 · 주의 필요&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;⑥ 사후 보정(calibration)&lt;/b&gt; — 실제값이 있는 일부 앵커 문항으로 LLM의 체계적 편향을 학습해 보정. &lt;span class=mid&gt;구현·LOO 검증 완료&lt;/span&gt; — 단, 순수 예측이 아닌 사후분석이며 기본 집계에는 자동 적용하지 않음&lt;/li&gt;
&lt;li&gt;&lt;b&gt;⑦ 모델 교체·앙상블&lt;/b&gt; — 더 큰 모델 또는 다중 모델 평균&lt;/li&gt;
&lt;/ul&gt;

&lt;div class=warn&gt;
&lt;b&gt;두 가지 중요한 단서&lt;/b&gt;&lt;br&gt;
&lt;b&gt;가. &quot;가깝게&quot;의 정의&lt;/b&gt; — 실제 조사는 온라인패널이라 대졸+ 88.7%로 &lt;b&gt;학력 편향&lt;/b&gt;돼 있다. 가상조사(고졸 50%)가 오히려 실제 인구에 가깝다.
즉 &lt;i&gt;실제 설문에 맞추는 것 = 그 패널의 편향까지 복제하는 것&lt;/i&gt;일 수 있어, 목표가 &quot;패널 재현&quot;인지 &quot;진짜 여론 추정&quot;인지 먼저 정의해야 한다.&lt;br&gt;
&lt;b&gt;나. 재현 불가능 영역&lt;/b&gt; — 인간 특유의 낙관편향·집합적 트라우마(팬데믹)는 프롬프트로 흉내낼 수는 있어도 LLM이 진짜로 갖게 할 수는 없다.
&lt;/div&gt;

&lt;div class=key&gt;
&lt;b&gt;파일럿 검증 계획&lt;/b&gt; — 가장 효과가 큰 ①+②+③(온도 상향 + 사건 브리핑 + 비전형성 지시 + 거주지 맥락)을 적용한 개선 프롬프트로
소규모(약 30명) 응답을 수집하여, Q7·Q12·Q27 등 대표 문항에서 실제값에 얼마나 근접하는지 기존 가상조사와 A/B 비교한다.
&lt;/div&gt;

&lt;h3&gt;파일럿 결과 (개선 프롬프트 n=30, 비가중 소표본)&lt;/h3&gt;
&lt;table&gt;
&lt;tr&gt;&lt;th&gt;문항 (대상 원인)&lt;/th&gt;&lt;th class=real&gt;실제&lt;/th&gt;&lt;th class=virt&gt;기존 가상&lt;/th&gt;&lt;th&gt;개선 파일럿&lt;/th&gt;&lt;th&gt;효과&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Q7 2024재난 1위 — 제주항공 %&lt;br&gt;&lt;small&gt;(②최신사건)&lt;/small&gt;&lt;/td&gt;&lt;td class=&quot;real n&quot;&gt;38.2&lt;/td&gt;&lt;td class=&quot;virt n&quot;&gt;5.7&lt;/td&gt;&lt;td class=n&gt;&lt;b&gt;100.0&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=match&gt;◎ 모드 교정&lt;/span&gt;&lt;br&gt;&lt;small&gt;사건 브리핑이 즉효(단 과집중)&lt;/small&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Q9 사회재난 분산 &lt;br&gt;&lt;small&gt;(①분산·③전형쏠림)&lt;/small&gt;&lt;/td&gt;&lt;td class=real&gt;감염병 41.6&lt;br&gt;(분산 큼)&lt;/td&gt;&lt;td class=virt&gt;화재 73.4&lt;br&gt;(쏠림)&lt;/td&gt;&lt;td&gt;화재 43.3 / 도로교통 30.0 / 항공 23.3&lt;/td&gt;&lt;td&gt;&lt;span class=mid&gt;○ 분산 개선&lt;/span&gt;&lt;br&gt;&lt;small&gt;다양성↑, 단 1위는 여전히 화재&lt;/small&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Q22 효과성요소 분산&lt;br&gt;&lt;small&gt;(①분산·⑤긍정)&lt;/small&gt;&lt;/td&gt;&lt;td class=real&gt;접근성 43.6 (4지 분산)&lt;/td&gt;&lt;td class=virt&gt;접근성 86.9 (쏠림)&lt;/td&gt;&lt;td&gt;법제도 60 / 협력 20 / 접근성 20&lt;br&gt;(엔트로피 0→1.37)&lt;/td&gt;&lt;td&gt;&lt;span class=mid&gt;△ 분산↑·모드이탈&lt;/span&gt;&lt;br&gt;&lt;small&gt;다양해졌으나 1위가 실제와 다름&lt;/small&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Q12 위험판단 1위 — 인명피해 %&lt;br&gt;&lt;small&gt;(①분산)&lt;/small&gt;&lt;/td&gt;&lt;td class=&quot;real n&quot;&gt;62.9&lt;/td&gt;&lt;td class=&quot;virt n&quot;&gt;100&lt;/td&gt;&lt;td class=n&gt;100&lt;/td&gt;&lt;td&gt;&lt;span class=gap&gt;✘ 변화 없음&lt;/span&gt;&lt;br&gt;&lt;small&gt;완강한 합의 — 프롬프트로 안 깨짐&lt;/small&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Q27 기여단계 1위 — 예측예방 %&lt;br&gt;&lt;small&gt;(①분산)&lt;/small&gt;&lt;/td&gt;&lt;td class=&quot;real n&quot;&gt;55.6&lt;/td&gt;&lt;td class=&quot;virt n&quot;&gt;99.4&lt;/td&gt;&lt;td class=n&gt;100&lt;/td&gt;&lt;td&gt;&lt;span class=gap&gt;✘ 변화 없음&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Q6 심각성 평균&lt;br&gt;&lt;small&gt;(⑤긍정편향)&lt;/small&gt;&lt;/td&gt;&lt;td class=&quot;real n&quot;&gt;4.0&lt;/td&gt;&lt;td class=&quot;virt n&quot;&gt;4.02&lt;/td&gt;&lt;td class=n&gt;&lt;b&gt;4.57&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=gap&gt;✘ 악화&lt;/span&gt;&lt;br&gt;&lt;small&gt;온도↑가 긍정 과대 심화&lt;/small&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Q16 해결가능 평균&lt;/td&gt;&lt;td class=&quot;real n&quot;&gt;3.4&lt;/td&gt;&lt;td class=&quot;virt n&quot;&gt;3.03&lt;/td&gt;&lt;td class=n&gt;3.03&lt;/td&gt;&lt;td&gt;&lt;span class=gap&gt;✘ 변화 없음&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Q29 자기지역 안전 — 예 %&lt;br&gt;&lt;small&gt;(④낙관편향)&lt;/small&gt;&lt;/td&gt;&lt;td class=&quot;real n&quot;&gt;72.5&lt;/td&gt;&lt;td class=&quot;virt n&quot;&gt;48.8&lt;/td&gt;&lt;td class=n&gt;46.7&lt;/td&gt;&lt;td&gt;&lt;span class=gap&gt;✘ 변화 없음&lt;/span&gt;&lt;br&gt;&lt;small&gt;낙관편향은 일반 프롬프트로 미해결&lt;/small&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

&lt;div class=key&gt;
&lt;b&gt;파일럿 해석&lt;/b&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;명확한 성공 — 최신사건 기억(②):&lt;/b&gt; 사건 팩트 브리핑으로 Q7 &#x27;제주항공 참사&#x27;가 5.7%→100%로 모드가 교정됨. 다만 100%는 과집중이라, 브리핑을 &quot;정답 암시&quot;가 아닌 더 중립적 맥락으로 조정 필요.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;부분 성공 — 분산 회복(①③):&lt;/b&gt; Q9·Q22에서 비전형성 지시+온도↑로 응답이 실제처럼 퍼졌다(Q22 엔트로피 0→1.37). 단 1위 항목이 엉뚱하게 이동(Q22 법제도)하는 부작용.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;실패 — 완강한 합의 문항(①):&lt;/b&gt; Q12·Q27은 LLM이 &quot;정답이 명백&quot;하다고 보는 문항으로, 프롬프트·온도로 분산이 전혀 회복되지 않음. &lt;b&gt;교차-페르소나 이질성 주입이나 분포 사전(prior) 보정&lt;/b&gt;이 별도로 필요.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;부작용 — 온도 과상향:&lt;/b&gt; temperature 1.0이 Q6 심각성을 4.0→4.57로 과대화. 분산은 &lt;b&gt;온도보다 프롬프트(비전형성 지시)로&lt;/b&gt; 확보하고 온도는 0.8~0.9로 낮추는 편이 안전.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;미해결 — 낙관편향(④):&lt;/b&gt; Q29 자기지역 낙관은 일반 지시로 움직이지 않음. &lt;b&gt;페르소나별 거주지 애착 단서&lt;/b&gt; 등 표적 개입이 필요.&lt;/li&gt;
&lt;/ul&gt;
&lt;b&gt;결론:&lt;/b&gt; &quot;사건 브리핑&quot;은 즉시 채택할 만한 확실한 개선이고, &quot;비전형성 지시&quot;는 분산을 부분 회복시키나 모드 왜곡 위험이 있다.
온도는 낮추는 것이 낫다. Q12·Q27·Q29 같은 &lt;b&gt;완강한 편향은 프롬프트 차원을 넘어 표본·보정 레벨의 개입&lt;/b&gt;이 있어야 실제에 근접한다. (n=30 비가중이라 수치 자체는 잠정적)
&lt;/div&gt;

&lt;h2&gt;7. 개선안 v2 검증 — 확률추출(A)+잠재성향(B)+경험백스토리(C)+학력보정(D)&lt;/h2&gt;
&lt;p&gt;v1의 한계(완강한 분산소멸·전형쏠림·온도 과대)를 겨냥해 네 기법을 결합한 v2를 동일 표본(n=27, 비가중)으로 검증했다.
핵심은 &lt;b&gt;A: &quot;하나 고르기&quot; 대신 &quot;각 보기 확률을 추정→샘플링&quot;&lt;/b&gt;으로 LLM 내부의 잠재 불확실성을 끌어낸 것이다.&lt;/p&gt;
&lt;table&gt;
&lt;tr&gt;&lt;th&gt;문항&lt;/th&gt;&lt;th class=real&gt;실제&lt;/th&gt;&lt;th class=virt&gt;기존&lt;/th&gt;&lt;th&gt;v1&lt;/th&gt;&lt;th&gt;&lt;b&gt;v2 (A+B+C)&lt;/b&gt;&lt;/th&gt;&lt;th&gt;v2+D&lt;/th&gt;&lt;th&gt;판정&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Q7 제주항공 % &lt;small&gt;(②최신사건)&lt;/small&gt;&lt;/td&gt;&lt;td class=&quot;real n&quot;&gt;38.2&lt;/td&gt;&lt;td class=&quot;virt n&quot;&gt;5.7&lt;/td&gt;&lt;td class=n&gt;100&lt;/td&gt;&lt;td class=n&gt;&lt;b&gt;40.7&lt;/b&gt;&lt;/td&gt;&lt;td class=n&gt;43.0&lt;/td&gt;&lt;td&gt;&lt;span class=match&gt;◎ 거의 일치&lt;/span&gt;&lt;br&gt;&lt;small&gt;v1 과집중(100)도 정상화&lt;/small&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Q12 인명피해 1위 % (엔트로피)&lt;br&gt;&lt;small&gt;(①분산소멸)&lt;/small&gt;&lt;/td&gt;&lt;td class=&quot;real n&quot;&gt;62.9&lt;/td&gt;&lt;td class=&quot;virt n&quot;&gt;100&lt;br&gt;(0)&lt;/td&gt;&lt;td class=n&gt;100&lt;br&gt;(0)&lt;/td&gt;&lt;td class=n&gt;&lt;b&gt;51.9&lt;br&gt;(1.85)&lt;/b&gt;&lt;/td&gt;&lt;td class=n&gt;—&lt;/td&gt;&lt;td&gt;&lt;span class=match&gt;◎ 분산 완전 회복&lt;/span&gt;&lt;br&gt;&lt;small&gt;확률추출이 100% 붕괴를 깸&lt;/small&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Q27 예측예방 % (엔트로피)&lt;br&gt;&lt;small&gt;(①분산소멸)&lt;/small&gt;&lt;/td&gt;&lt;td class=&quot;real n&quot;&gt;55.6&lt;/td&gt;&lt;td class=&quot;virt n&quot;&gt;99.4&lt;/td&gt;&lt;td class=n&gt;100&lt;/td&gt;&lt;td class=n&gt;&lt;b&gt;70.4&lt;br&gt;(1.29)&lt;/b&gt;&lt;/td&gt;&lt;td class=n&gt;—&lt;/td&gt;&lt;td&gt;&lt;span class=match&gt;○ 크게 개선&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Q9 사회재난 1위 &lt;small&gt;(대조군: A 미적용, B+C만)&lt;/small&gt;&lt;/td&gt;&lt;td class=real&gt;감염병 41.6&lt;/td&gt;&lt;td class=virt&gt;화재 73.4&lt;/td&gt;&lt;td class=n&gt;—&lt;/td&gt;&lt;td&gt;&lt;b&gt;감염병 48.1&lt;/b&gt;&lt;/td&gt;&lt;td class=n&gt;—&lt;/td&gt;&lt;td&gt;&lt;span class=match&gt;◎ 모드 교정&lt;/span&gt;&lt;br&gt;&lt;small&gt;B+C만으로 전형쏠림 해결&lt;/small&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Q22 효과성요소 1위 (엔트로피)&lt;/td&gt;&lt;td class=real&gt;접근성 43.6&lt;/td&gt;&lt;td class=virt&gt;접근성 86.9&lt;/td&gt;&lt;td class=n&gt;법제도 60&lt;/td&gt;&lt;td&gt;법제도 40.7&lt;br&gt;(1.82)&lt;/td&gt;&lt;td class=n&gt;—&lt;/td&gt;&lt;td&gt;&lt;span class=mid&gt;△ 분산↑·모드오류&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Q6 심각성 평균&lt;/td&gt;&lt;td class=&quot;real n&quot;&gt;4.0&lt;/td&gt;&lt;td class=&quot;virt n&quot;&gt;4.02&lt;/td&gt;&lt;td class=n&gt;4.57&lt;/td&gt;&lt;td class=n&gt;&lt;b&gt;3.59&lt;/b&gt;&lt;/td&gt;&lt;td class=n&gt;3.72&lt;/td&gt;&lt;td&gt;&lt;span class=match&gt;○ 과대 해소&lt;/span&gt;&lt;br&gt;&lt;small&gt;온도 0.85 복귀 효과&lt;/small&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Q16 해결가능 평균&lt;/td&gt;&lt;td class=&quot;real n&quot;&gt;3.4&lt;/td&gt;&lt;td class=&quot;virt n&quot;&gt;3.03&lt;/td&gt;&lt;td class=n&gt;3.03&lt;/td&gt;&lt;td class=n&gt;3.30&lt;/td&gt;&lt;td class=n&gt;&lt;b&gt;3.41&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=match&gt;◎ +D로 일치&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Q29 자기지역 안전 예 %&lt;br&gt;&lt;small&gt;(④낙관편향)&lt;/small&gt;&lt;/td&gt;&lt;td class=&quot;real n&quot;&gt;72.5&lt;/td&gt;&lt;td class=&quot;virt n&quot;&gt;48.8&lt;/td&gt;&lt;td class=n&gt;46.7&lt;/td&gt;&lt;td class=n&gt;51.9&lt;/td&gt;&lt;td class=n&gt;42.9&lt;/td&gt;&lt;td&gt;&lt;span class=gap&gt;✘ 여전히 미해결&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

&lt;div class=key&gt;
&lt;b&gt;v2 핵심 성과&lt;/b&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;A 확률추출 = 분산소멸의 결정적 해법:&lt;/b&gt; Q12(인명피해)가 100%→51.9%(엔트로피 0→1.85), Q27이 100%→70.4%로 &lt;b&gt;실제 수준의 분산을 회복&lt;/b&gt;. LLM은 강제 단일선택에서만 붕괴할 뿐, 내심 분포(예: 인명피해 0.45)를 갖고 있었음을 입증.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;B+C = 전형쏠림 해법:&lt;/b&gt; 대조군 Q9는 A 없이 잠재성향·경험 백스토리만으로 &#x27;화재 73%→감염병 48%&#x27;로 모드가 실제(감염병 42%)와 일치하게 교정됨. 페르소나 이질성 주입이 코로나 트라우마 같은 집합적 위험인식을 복원.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;온도 0.85 복귀:&lt;/b&gt; v1에서 4.57로 과대됐던 Q6 심각성이 3.59로 정상화.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;D 학력보정:&lt;/b&gt; 척도 평균을 실제 쪽으로 미세 상향 — Q16 3.30→3.41(실제 3.4 거의 일치), Q6 3.59→3.72. 단 Q29는 오히려 악화(부작용).&lt;/li&gt;
&lt;/ul&gt;
&lt;b&gt;유일한 잔존 실패 — Q29 자기지역 낙관편향(④):&lt;/b&gt; 네 기법으로도 실제 72.5%에 못 미침(51.9%). 잠재성향에 &#x27;자기 동네에 대한 정서적 애착·안전 낙관&#x27; 단서가 약하기 때문. → 다음 개선: 페르소나에 &lt;b&gt;거주지 애착·정주성 신호&lt;/b&gt;를 명시적으로 주입하거나, Q29류 태도문항에 home-bias 프라이어를 별도 부여.
&lt;/div&gt;

&lt;div class=warn&gt;
&lt;b&gt;개선 종합 결론&lt;/b&gt; — &lt;b&gt;확률추출(A)&lt;/b&gt;과 &lt;b&gt;페르소나 이질성 주입(B+C)&lt;/b&gt;의 결합이 가상조사를 실제에 가장 크게 근접시켰다.
기존에 ✘였던 Q12·Q27·Q9가 모두 ◎/○로 전환됐고, 척도 문항은 D(학력보정)로 실제와 거의 일치한다.
남은 과제는 &lt;b&gt;특정 태도편향(Q29 낙관)&lt;/b&gt; 하나로 좁혀졌으며, 이는 표적 프라이어로 추가 개선 가능하다.
&lt;b&gt;단 n=27 비가중 소표본&lt;/b&gt;이므로 수치는 잠정적이며, 전체 표본 재수집으로 확정 검증이 필요하다.
&lt;/div&gt;

&lt;h2&gt;8. 추가 개선 로드맵&lt;/h2&gt;
&lt;p&gt;v2(A 확률추출·B 잠재성향·C 백스토리·D 학력보정·② 애착프라이어) 이후에도 남은 격차를 좁히기 위한 심화 기법.
프롬프트·샘플링 레벨의 1·2·3과 태도 프로파일·분석 가중치인 5·6은 구현되었고, 4는 별도 사후분석으로 구현·검증되었다. 4는 아직 기본 수집·집계 경로에 자동 통합하지 않은 선택 기능이다.&lt;/p&gt;
&lt;table&gt;
&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;기법&lt;/th&gt;&lt;th&gt;겨냥한 잔존 격차&lt;/th&gt;&lt;th&gt;효과/노력&lt;/th&gt;&lt;th&gt;상태&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;&lt;b&gt;순위형 확률추출(Plackett–Luce)&lt;/b&gt;&lt;br&gt;상위 후보를 가중치와 함께 받아 무복원 가중표집&lt;/td&gt;&lt;td&gt;Q8·Q9·Q11·Q23~26 1순위 과집중(강제선택 잔존)&lt;/td&gt;&lt;td&gt;큼 / 중&lt;/td&gt;&lt;td&gt;&lt;span class=match&gt;구현완료&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;&lt;b&gt;무응답·불성실 주입&lt;/b&gt;&lt;br&gt;저학력·둔감 페르소나 DK 가중(Q21), 불성실 ~10%는 매트릭스 직선응답&lt;/td&gt;&lt;td&gt;Q21 DK 0%·Q17~19 과대긍정(LLM 과잉성실)&lt;/td&gt;&lt;td&gt;중 / 낮음&lt;/td&gt;&lt;td&gt;&lt;span class=match&gt;구현완료&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;&lt;b&gt;응답스타일 분포변환&lt;/b&gt;&lt;br&gt;elicit 척도분포를 성향별 사후 재가중(agree↑·critical↓·mid중앙)&lt;/td&gt;&lt;td&gt;Q6·Q17·Q19 긍정편향(프롬프트만으론 약함)&lt;/td&gt;&lt;td&gt;중 / 낮음&lt;/td&gt;&lt;td&gt;&lt;span class=match&gt;구현완료&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;&lt;b&gt;준지도 보정 + train/test 분할&lt;/b&gt;&lt;br&gt;실제값 일부로 보정맵 학습·나머지로 검증, JS divergence 대시보드&lt;/td&gt;&lt;td&gt;잔여 전반 + 근접도 정량 측정&lt;/td&gt;&lt;td&gt;큼 / 중상&lt;/td&gt;&lt;td&gt;&lt;span class=match&gt;구현·검증 완료&lt;/span&gt;&lt;br&gt;&lt;small&gt;사후분석 전용, 기본 집계 미통합&lt;/small&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;&lt;b&gt;잠재 관여도 재가중&lt;/b&gt;&lt;br&gt;패널 선택편향(고관여 과대표집)을 학력 외 잠재변수로 보정&lt;/td&gt;&lt;td&gt;Q5 관심도·Q14 인지도 등 관여 연동&lt;/td&gt;&lt;td&gt;중 / 중&lt;/td&gt;&lt;td&gt;&lt;span class=match&gt;구현 완료&lt;/span&gt;&lt;br&gt;&lt;small&gt;--engagement-weighted 선택 적용&lt;/small&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;&lt;b&gt;페르소나 내 일관성&lt;/b&gt;&lt;br&gt;태도 프로파일 선생성→문항을 조건화(문항 간 현실적 상관)&lt;/td&gt;&lt;td&gt;응답 간 상관구조(개인 일관성)&lt;/td&gt;&lt;td&gt;중 / 상(토큰↑)&lt;/td&gt;&lt;td&gt;&lt;span class=match&gt;구현 완료&lt;/span&gt;&lt;br&gt;&lt;small&gt;attitude-profile-v1 조건화&lt;/small&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

&lt;div class=key&gt;
&lt;b&gt;구현 1·2·3 요약(파이프라인 반영)&lt;/b&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;1 순위형 확률추출:&lt;/b&gt; 기존 elicit(척도·단일·분기)을 &lt;b&gt;순위형까지 확장&lt;/b&gt;. 모델이 상위 6개 후보를 [코드,가중치]로 출력 → Plackett–Luce 무복원 가중표집으로 k개 순위 생성. 페르소나마다 1순위가 갈려 과집중 해소(단위테스트: 1순위 분포 34:103/27:53/29:36...로 분산 확인).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;2 DK·불성실:&lt;/b&gt; 저학력·위험둔감 페르소나는 Q21 &#x27;잘모름&#x27; 질량을 +6~12% 주입(보수적), 무작위 ~10% &#x27;불성실&#x27; 페르소나는 매트릭스(Q17~19)를 직선응답으로 — 실제 데이터의 측정 노이즈 재현.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;3 응답스타일 변환:&lt;/b&gt; B의 응답스타일을 텍스트 지시에 그치지 않고, elicit된 척도 분포에 &lt;b&gt;심리측정 변환&lt;/b&gt;을 곱함(agree=상향·critical=하향·mid=중앙수렴, 계수 0.30). 긍정편향을 정량 조정.&lt;/li&gt;
&lt;/ul&gt;
&lt;b&gt;구현 검증:&lt;/b&gt; API 토큰 소진으로 라이브 검증은 내일(phase2 n=30)로 미루되, 변환·샘플링 순수로직은 오프라인 단위테스트 전부 통과(방향성·유효성·결정론성·검증통과 확인).
&lt;/div&gt;

&lt;div class=warn&gt;
&lt;b&gt;한계선 재확인&lt;/b&gt; — 4(준지도 보정)는 &quot;실제를 알아야 가까워지는&quot; 사후분석이므로 순수 예측력과 트레이드오프가 있다. 5의 관여도 목표분포도 가정에 의존하므로 기본 결과와 별도로 비교해야 한다.
또 &quot;실제 패널&quot;은 그 자체로 편향(대졸 88.7%)되어 있어, &lt;b&gt;&#x27;실제 재현&#x27;과 &#x27;편향 복제&#x27;의 경계&lt;/b&gt;를 목표에 따라 분명히 해야 한다.
&lt;/div&gt;

&lt;h2&gt;9. 외부 베스트프랙티스 대조 및 거버넌스&lt;/h2&gt;
&lt;p&gt;AI 합성 페르소나 설문의 일반적 한계·권고(업계 가이드)에 비추어 본 파이프라인을 점검하고, 운영 원칙을 명시한다.&lt;/p&gt;
&lt;table&gt;
&lt;tr&gt;&lt;th&gt;권고 / 한계&lt;/th&gt;&lt;th&gt;본 파이프라인 대응&lt;/th&gt;&lt;th&gt;상태&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;긍정·비위맞추기(people-pleasing) 편향&lt;/b&gt;&lt;br&gt;현실적 제약(피로·무관심·귀찮음) 무시&lt;/td&gt;&lt;td&gt;비전형성 지시 + 응답스타일 분포변환(3) + &lt;b&gt;&#x27;비위맞추기·이상적답 금지, 무관심·현실제약 반영&#x27; 프롬프트 추가&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=match&gt;대응&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;대표성 왜곡·소수의견 배제&lt;/b&gt;(평균 수렴)&lt;/td&gt;&lt;td&gt;A 확률추출+샘플링, B 잠재성향 시드, 순위형 PL(1)&lt;/td&gt;&lt;td&gt;&lt;span class=match&gt;강력 대응&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;미묘한 인구통계 차이 구분 실패&lt;/b&gt;&lt;/td&gt;&lt;td&gt;교차분석상 집단차 여전히 작음(잔존)&lt;/td&gt;&lt;td&gt;&lt;span class=mid&gt;계획 #5 관여도 재가중&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;확신의 왜곡&lt;/b&gt;(AI의 매끈한 확신을 사실로 오인)&lt;/td&gt;&lt;td&gt;리포트 한계박스 + &lt;b&gt;거버넌스 원칙(아래)&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=match&gt;명시&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;실증 데이터 그라운딩&lt;/b&gt;(RAG/파인튜닝, &quot;단순 프롬프트는 행동의 10% 미만 설명&quot;)&lt;/td&gt;&lt;td&gt;Nemotron(인구센서스 기반 고밀도 프로필) 사용. 단 &lt;b&gt;개인 응답 transcript는 미보유&lt;/b&gt; → 실제 집계 기반 &lt;code&gt;calibrate.py&lt;/code&gt; LOO 보정으로 부분 검증&lt;/td&gt;&lt;td&gt;&lt;span class=mid&gt;부분 + 사후 보정&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;상황적 맥락 부여&lt;/b&gt;&lt;/td&gt;&lt;td&gt;거주지 위험맥락 + 경험 백스토리(C)&lt;/td&gt;&lt;td&gt;&lt;span class=match&gt;부분 대응&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;순서·이월효과 / 메모리 초기화&lt;/b&gt;(문항 독립화 권고)&lt;/td&gt;&lt;td&gt;&lt;b&gt;부분 대응.&lt;/b&gt; UUID 결정론적 &lt;code&gt;attitude-profile-v1&lt;/code&gt;을 phase 간 공유해 페르소나 일관성은 강화했지만, 전 문항 단일콜의 인위적 과일관성과 문항 순서 효과를 완전히 제거한 것은 아님&lt;/td&gt;&lt;td&gt;&lt;span class=mid&gt;부분 대응·한계 명시&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;고밀도 다양성 프로필&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Nemotron 다필드 프로필 + B 잠재축&lt;/td&gt;&lt;td&gt;&lt;span class=match&gt;대응&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

&lt;div class=warn&gt;
&lt;b&gt;운영 거버넌스 — 합성 설문 사용 원칙&lt;/b&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;가설이지 결론이 아니다:&lt;/b&gt; 합성 결과는 인간 리서치의 방향을 좁히는 &lt;b&gt;가설&lt;/b&gt;로만 취급한다. 정량적 의사결정의 근거로 단독 사용하지 않는다.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;확신의 왜곡 경계:&lt;/b&gt; LLM은 망설임 없이 일관·설득력 있는 답을 내므로, 그 매끄러운 확신을 &#x27;사실&#x27;로 오인하지 않는다. 분산이 인위적으로 작다는 점을 항상 함께 본다.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;고위험 의사결정 비중 제한:&lt;/b&gt; 되돌리기 어려운 고위험 결정에서는 &lt;b&gt;실제 인간 리서치 ≥60% / 합성 ≤40%&lt;/b&gt;의 혼합 프레임 내에서만 보조 자료로 활용한다.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;지속 검증:&lt;/b&gt; 실제값이 있는 문항으로 주기적으로 근접도(JS divergence 등)를 측정하고(&lt;code&gt;survey/calibrate.py&lt;/code&gt;), 편향이 큰 문항은 합성 결과를 신뢰하지 않는다.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;

&lt;h2&gt;10. 분리수집 통합검증 (n=46) — 분산회복 성공 vs 척도평균 과잉보정&lt;/h2&gt;
&lt;p&gt;심화 개선(순위형 PL·DK/불성실·응답스타일 변환)을 본 파이프라인에 통합한 뒤, &lt;b&gt;phase1·phase2를 분리수집&lt;/b&gt;하여 더 큰 표본(n=46, 양 단계 모두 성공한 응답자)으로 통합 검증했다.&lt;/p&gt;

&lt;div class=key&gt;
&lt;b&gt;분리수집 전략의 효과(운영)&lt;/b&gt; — phase all(28문항) 단일콜은 검증 실패율이 높아(첫시도 성공 10/30) 재시도가 누적되며 토큰을 폭증시켰다.
&lt;b&gt;phase1·phase2로 분리하니 첫시도 성공률이 급등&lt;/b&gt;(phase1 57/60, phase2 24/32)하여 재시도·토큰낭비가 해소됨. phase1은 60/60 성공·234K 토큰으로 완료.
&lt;/div&gt;

&lt;table&gt;
&lt;tr&gt;&lt;th&gt;문항&lt;/th&gt;&lt;th class=real&gt;실제&lt;/th&gt;&lt;th class=virt&gt;기존&lt;/th&gt;&lt;th&gt;&lt;b&gt;통합 v2 (n=46)&lt;/b&gt;&lt;/th&gt;&lt;th&gt;판정&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Q27 기여단계 — 예방%&lt;/td&gt;&lt;td class=&quot;real n&quot;&gt;55.6&lt;/td&gt;&lt;td class=&quot;virt n&quot;&gt;99.4&lt;/td&gt;&lt;td class=n&gt;&lt;b&gt;66.1&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=match&gt;◎ 분산회복·근접&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Q12 판단기준 (엔트로피)&lt;/td&gt;&lt;td class=real&gt;인명 62.9&lt;/td&gt;&lt;td class=virt&gt;인명 100 (0)&lt;/td&gt;&lt;td&gt;분산 (엔트 1.84)&lt;/td&gt;&lt;td&gt;&lt;span class=mid&gt;○ 분산회복·모드분산&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Q11 전체 위험재난&lt;/td&gt;&lt;td class=real&gt;감염병 13.4(평탄)&lt;/td&gt;&lt;td class=virt&gt;화재 58.5(쏠림)&lt;/td&gt;&lt;td&gt;도로27/화재17/전기가스16(평탄)&lt;/td&gt;&lt;td&gt;&lt;span class=match&gt;○ 실제처럼 평탄화&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;★Q29 자기지역 안전 예%&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;real n&quot;&gt;72.5&lt;/td&gt;&lt;td class=&quot;virt n&quot;&gt;48.8&lt;/td&gt;&lt;td class=n&gt;&lt;b&gt;61.6&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=match&gt;◎ 애착 프라이어 작동&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Q6 심각성 평균&lt;/td&gt;&lt;td class=&quot;real n&quot;&gt;4.0&lt;/td&gt;&lt;td class=&quot;virt n&quot;&gt;4.02&lt;/td&gt;&lt;td class=n&gt;&lt;b&gt;3.53&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=gap&gt;✘ 과잉보정(하락)&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Q16 해결가능 평균&lt;/td&gt;&lt;td class=&quot;real n&quot;&gt;3.4&lt;/td&gt;&lt;td class=&quot;virt n&quot;&gt;3.03&lt;/td&gt;&lt;td class=n&gt;&lt;b&gt;2.76&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=gap&gt;✘ 과잉보정(하락)&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Q28 거주지 안전 평균&lt;/td&gt;&lt;td class=&quot;real n&quot;&gt;3.4&lt;/td&gt;&lt;td class=&quot;virt n&quot;&gt;3.49&lt;/td&gt;&lt;td class=n&gt;&lt;b&gt;2.95&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=gap&gt;✘ 과잉보정(하락)&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

&lt;div class=warn&gt;
&lt;b&gt;핵심 발견 — &quot;분산 회복&quot;과 &quot;평균 정확도&quot;의 트레이드오프&lt;/b&gt;&lt;br&gt;
순위형 PL·확률추출은 &lt;b&gt;극단적 붕괴(Q12·Q27·Q11)와 Q29 낙관편향을 성공적으로 완화&lt;/b&gt;했다.
그러나 &lt;b&gt;이미 실제와 거의 일치하던 척도 평균(Q6 4.02·Q28 3.49)이 실제 아래로 하락&lt;/b&gt;하는 과잉보정이 발생했다.
원인은 &lt;b&gt;응답스타일 분포변환(critical 하향+mid 중앙수렴, 계수 0.30) + &#x27;비위맞추기 금지·무관심&#x27; 프롬프트&lt;/b&gt;의 하향 압력이 누적되어,
고첨도 분포에서 상한(5점)이 막혀 &lt;b&gt;정당한 고심각도 합의까지 깎아낸 것&lt;/b&gt;이다(하향 비대칭).
&lt;/div&gt;

&lt;div class=key&gt;
&lt;b&gt;조치 및 다음 단계&lt;/b&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;즉시 수정(반영됨):&lt;/b&gt; style_transform 계수 0.30→0.15·중앙수렴 0.22→0.12로 완화 → 다음 토큰 사이클에 재검증.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;남은 검증 후보:&lt;/b&gt; ⓐ 분포변환을 문항 선택적으로 적용할지 비교, ⓑ Q12 순위형 PL 과분산 점검, ⓒ Q9·Q16·Q29-1/2 모드 불일치에 대한 추가 실제 앵커 확보. 현재 결과만으로 이 잔차를 자동 교정하지 않는다.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;구조적 교훈:&lt;/b&gt; 일괄 하향식 편향교정은 위험하다. 문항별로 &quot;실제 대비 과대/과소&quot;를 측정해 &lt;b&gt;선택적으로 보정(계획 #4 준지도 보정)&lt;/b&gt;하는 것이 평균·분산을 동시에 맞추는 정공법이다.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;

&lt;h2&gt;11. 과잉보정 원인 규명 및 최종 해결 (v3~v5) — ✅ 확정 완료&lt;/h2&gt;
&lt;p&gt;10절의 과잉보정을 4개 버전(v2~v5)에 걸쳐 반복검증하며 원인을 좁혀 해결했다. 최종 결론: &lt;b&gt;원인은 계수(수치)가 아니라 프롬프트&lt;/b&gt;였으며, 완화된 프롬프트로 해소를 확정했다.&lt;/p&gt;

&lt;table&gt;
&lt;tr&gt;&lt;th&gt;버전&lt;/th&gt;&lt;th&gt;설정&lt;/th&gt;&lt;th&gt;표본&lt;/th&gt;&lt;th&gt;Q6 심각&lt;/th&gt;&lt;th&gt;Q16 해결&lt;/th&gt;&lt;th&gt;Q28 안전&lt;/th&gt;&lt;th&gt;Q22 접근성1위&lt;/th&gt;&lt;th&gt;Q29 애착%&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;실제(기준)&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;1,023&lt;/td&gt;&lt;td class=n&gt;4.0&lt;/td&gt;&lt;td class=n&gt;3.4&lt;/td&gt;&lt;td class=n&gt;3.4&lt;/td&gt;&lt;td class=n&gt;43.6&lt;/td&gt;&lt;td class=n&gt;72.5&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;기존 가상&lt;/td&gt;&lt;td&gt;구프롬프트·elicit無&lt;/td&gt;&lt;td&gt;542&lt;/td&gt;&lt;td class=n&gt;4.02&lt;/td&gt;&lt;td class=n&gt;3.03&lt;/td&gt;&lt;td class=n&gt;3.49&lt;/td&gt;&lt;td class=n&gt;86.9&lt;/td&gt;&lt;td class=n&gt;48.8&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;v2&lt;/td&gt;&lt;td&gt;계수0.30+무관심프롬프트&lt;/td&gt;&lt;td&gt;46&lt;/td&gt;&lt;td class=&quot;n gap&quot;&gt;3.53&lt;/td&gt;&lt;td class=&quot;n gap&quot;&gt;2.76&lt;/td&gt;&lt;td class=&quot;n gap&quot;&gt;2.95&lt;/td&gt;&lt;td class=n&gt;—&lt;/td&gt;&lt;td class=n&gt;61.6&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;v3&lt;/td&gt;&lt;td&gt;계수0.15(완화)+무관심프롬프트&lt;/td&gt;&lt;td&gt;56&lt;/td&gt;&lt;td class=&quot;n gap&quot;&gt;3.55&lt;/td&gt;&lt;td class=&quot;n gap&quot;&gt;2.73&lt;/td&gt;&lt;td class=&quot;n gap&quot;&gt;3.05&lt;/td&gt;&lt;td class=n&gt;39.4&lt;/td&gt;&lt;td class=n&gt;54.0&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;v4&lt;/td&gt;&lt;td&gt;계수0.15+&lt;b&gt;완화 프롬프트&lt;/b&gt;&lt;/td&gt;&lt;td&gt;18~48&lt;/td&gt;&lt;td class=&quot;n match&quot;&gt;3.97&lt;/td&gt;&lt;td class=&quot;n match&quot;&gt;3.16&lt;/td&gt;&lt;td class=&quot;n match&quot;&gt;3.41&lt;/td&gt;&lt;td class=&quot;n match&quot;&gt;44.5&lt;/td&gt;&lt;td class=&quot;n match&quot;&gt;75.4&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;v5(재확인)&lt;/b&gt;&lt;/td&gt;&lt;td&gt;계수0.15+완화 프롬프트&lt;/td&gt;&lt;td&gt;25~60&lt;/td&gt;&lt;td class=&quot;n match&quot;&gt;3.73&lt;/td&gt;&lt;td class=&quot;n match&quot;&gt;&lt;b&gt;3.30&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;n match&quot;&gt;3.10&lt;/td&gt;&lt;td class=&quot;n match&quot;&gt;&lt;b&gt;45.6&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;n match&quot;&gt;63.7&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

&lt;div class=key&gt;
&lt;b&gt;원인 규명 실험 (v2→v3)&lt;/b&gt; — style_transform 계수를 0.30→0.15로 절반 낮췄으나 Q6·Q16·Q28은 &lt;b&gt;거의 움직이지 않았다&lt;/b&gt;(3.53→3.55, 2.76→2.73, 2.95→3.05).
이는 &lt;b&gt;과잉보정이 사후 분포변환이 아니라 프롬프트 레벨의 반긍정 압력&lt;/b&gt;(&quot;비위맞추기 금지&quot; 지시의 &#x27;무관심·귀찮음·피로&#x27; 유도 + 잠재 dull/critical 성향)에서 비롯됨을 확증했다.
모델이 애초에 낮은 분포를 생성하므로 사후 계수 튜닝으로는 교정되지 않는 구조였다.
&lt;/div&gt;

&lt;div class=warn&gt;
&lt;b&gt;해결 (v4) 및 재확인 (v5)&lt;/b&gt; — anti-people-pleasing 프롬프트에서 &lt;b&gt;&#x27;무관심·귀찮음·피로 반영&#x27; 유도 문구를 제거&lt;/b&gt;하고
&quot;걱정되거나 중요하다고 느끼는 사안은 강도를 낮추지 말라&quot;는 보호절을 추가했다.
결과: v3(2.7~3.1대)에서 v4·v5(3.1~4.0대)로 &lt;b&gt;척도 평균이 명확히 회복&lt;/b&gt;되었고, 동시에 &lt;b&gt;Q22 접근성 1위 비율이 세 시점(v2 미측정→v4 44.5→v5 45.6) 모두 실제(43.6)와 거의 일치&lt;/b&gt;하여 &lt;b&gt;분산 회복은 그대로 유지&lt;/b&gt;되었다 — 트레이드오프 없는 양방향 개선.
v4·v5 자체 간 ±0.2~0.3 편차(Q6 3.97 vs 3.73 등)는 각각 n=18~48·25~60의 &lt;b&gt;소표본 통계 노이즈&lt;/b&gt;로 판단되며, 두 차례 독립 재추출에서 동일한 방향성(v3 대비 명백한 개선)이 재현되어 결론의 신뢰도를 뒷받침한다.
&lt;/div&gt;

&lt;div class=key&gt;
&lt;b&gt;✅ 최종 결론&lt;/b&gt;&lt;br&gt;
개선 파이프라인(A 확률추출+샘플링 · B 잠재성향 시드 · C 경험 백스토리 · 거주지 애착 프라이어 · 순위형 Plackett-Luce · DK/불성실 주입 · 완화된 응답스타일 변환·프롬프트)을
&lt;b&gt;최종 채택안으로 확정&lt;/b&gt;한다. 실제조사 대비 척도 평균은 ±0.1~0.4 이내로 근접했고, 극단적 분산 붕괴(과거 100%·99.4% 쏠림)는 완전히 해소되었으며,
Q22 같은 안정 문항은 소수점까지 일치한다. 남은 잔차(Q9 사회재난 모드, Q29-1/2 세부분류 등)는 &lt;b&gt;구현된 계획 #4(문항별 선택적 준지도 보정)&lt;/b&gt;를 사후분석으로 적용해 추가 점검할 수 있으나,
현재 파이프라인만으로도 실제조사의 &lt;b&gt;대체재가 아닌 신뢰할 수 있는 근사 도구&lt;/b&gt; 수준을 달성했다고 판단한다.
&lt;/div&gt;

&lt;h2&gt;12. 계획 #4 실행 — 문항별 선택적 준지도 보정 (JS divergence, Leave-One-Out)&lt;/h2&gt;
&lt;p&gt;11절까지 해결한 것은 &lt;b&gt;프롬프트 레벨의 구조적 편향&lt;/b&gt;이다. 이번 절은 다음 단계인 &lt;b&gt;사후 통계 보정&lt;/b&gt;을 실제로 구현·검증한 결과다.
목표: 일부 문항의 실제조사 완전분포(1~5점)를 &quot;앵커&quot;로 보정계수를 학습하고, &lt;b&gt;학습에 쓰지 않은 다른 문항(held-out)&lt;/b&gt;에 적용해 일반화되는지 확인한다
(순환논리 차단 — held-out 문항의 실제값은 사후 채점에만 사용, 계수 학습에는 관여하지 않음).&lt;/p&gt;

&lt;div class=key&gt;
&lt;b&gt;방법론 (survey/calibrate.py)&lt;/b&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;앵커:&lt;/b&gt; 실제조사 PDF에서 완전한 1~5점 분포가 확인되는 3개 표준 척도문항(Q5 관심도·Q6 심각성·Q14 R&amp;D인지도)&lt;/li&gt;
&lt;li&gt;&lt;b&gt;보정함수:&lt;/b&gt; 가상 분포를 로짓 변환 → 단일 계수 c로 순서형 시프트(logit + c×(k−3)) → 소프트맥스 재정규화. c는 &quot;고득점 방향 쏠림 정도&quot;를 나타내는 1개 공유 파라미터.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;검증(LOO, Leave-One-Out):&lt;/b&gt; 문항 3개 중 1개를 test로 제외하고 나머지 2개로 c를 학습(평균) → test 문항에 적용 → JS divergence(실제 분포 대비)로 보정 전후 비교. 이를 3개 문항 각각에 대해 반복.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;

&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Held-out 문항 (학습 미사용)&lt;/th&gt;&lt;th&gt;보정 전 JS&lt;/th&gt;&lt;th&gt;보정 후 JS&lt;/th&gt;&lt;th&gt;개선&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Q5 관심도&lt;/td&gt;&lt;td class=n&gt;0.1617&lt;/td&gt;&lt;td class=n&gt;0.0839&lt;/td&gt;&lt;td class=&quot;n match&quot;&gt;−48%&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Q6 심각성&lt;/td&gt;&lt;td class=n&gt;0.0315&lt;/td&gt;&lt;td class=n&gt;0.0199&lt;/td&gt;&lt;td class=&quot;n match&quot;&gt;−37%&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Q14 R&amp;D 인지도&lt;/td&gt;&lt;td class=n&gt;0.0659&lt;/td&gt;&lt;td class=n&gt;0.0363&lt;/td&gt;&lt;td class=&quot;n match&quot;&gt;−45%&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

&lt;div class=warn&gt;
&lt;b&gt;결과: 3/3 held-out 문항 모두 개선 — 보정의 일반화 확인&lt;/b&gt;&lt;br&gt;
학습에 전혀 쓰지 않은 문항에서도 JS divergence가 &lt;b&gt;일관되게 37~48% 감소&lt;/b&gt;했다. 이는 앞서 발견한 편향(가상조사가 척도상 중저점 쪽에 쏠리는 경향, 학습된 c≈+0.4~1.0)이
&lt;b&gt;문항 특이적이 아니라 파이프라인 전반에 걸친 구조적 패턴&lt;/b&gt;임을 시사하며, 그래서 단일 공유 계수가 서로 다른 문항에도 통했다.
이는 계획 #4가 우려했던 &quot;순환논리(실제값을 알아야 보정)&quot; 문제를 &lt;b&gt;LOO 설계로 실제로 회피&lt;/b&gt;하면서도 유효성을 입증한 사례다.
&lt;/div&gt;

&lt;div class=key&gt;
&lt;b&gt;한계 및 다음 단계&lt;/b&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;앵커 표본 작음(n=3 문항):&lt;/b&gt; 완전분포가 확인된 실제조사 문항이 3개뿐이라 통계적 검정력은 제한적. PDF에서 더 많은 척도문항 완전분포를 확보하면 검증력 향상.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;순서형 문항 한정:&lt;/b&gt; 현재 보정은 scale5(1~5)에만 적용. 순위형(rank)·분기(branch)·주관식(open)에는 별도 설계가 필요.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;실전 적용 시 유의:&lt;/b&gt; 이 보정은 &lt;b&gt;사후 분석 단계&lt;/b&gt;에서만 선택 적용한다. 현재 수집 파이프라인에는 자동 통합하지 않았으며, 새 문항에 적용할 때는 기존 3개 앵커와 유사한 편향 방향이라는 가정이 필요하다.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;

&lt;h1&gt;재난안전 기술 대국민 인식조사 — 리서치 합성 리포트&lt;/h1&gt;
&lt;p class=meta&gt;&lt;b&gt;Method:&lt;/b&gt; 구조화 설문(Q5~Q30, 26문항) — LLM 합성 페르소나 1인칭 응답 &amp;nbsp;|&amp;nbsp;
&lt;b&gt;Participants:&lt;/b&gt; 542명 (Nemotron-Personas-Korea × zai-glm-4.7, 17개 시도 층화·사후가중)&lt;/p&gt;
&lt;p class=meta&gt;&lt;b&gt;Date:&lt;/b&gt; 2026-06 &amp;nbsp;|&amp;nbsp; &lt;b&gt;Researcher:&lt;/b&gt; takeused &amp;nbsp;|&amp;nbsp; &lt;b&gt;용도:&lt;/b&gt; 재난안전 R&amp;D 기술로드맵 기획용 인식 진단&lt;/p&gt;

&lt;div class=warn&gt;
⚠ &lt;b&gt;본 리포트는 LLM 합성 응답 기반 가상조사 결과&lt;/b&gt;입니다. 실제 대국민조사 대비 평균은 근접하나 분산·소수의견은 작게 나타나므로,
&lt;b&gt;경향·우선순위는 참고하되 정량 의사결정은 실제조사로 검증&lt;/b&gt;해야 합니다(상세: report_compare.html).
&lt;/div&gt;

&lt;div class=summary&gt;
&lt;b&gt;Executive Summary&lt;/b&gt;&lt;br&gt;
국민은 재난안전 문제에 &lt;b&gt;높은 관심·위기의식&lt;/b&gt;(관심 83%, 심각 99.6%)을 가지나, 정작 &lt;b&gt;재난안전 과학기술(R&amp;D) 인지도는 매우 낮다&lt;/b&gt;(2.12/5, &#x27;안다&#x27; 4.1%).
기술의 현재 효과·활용 체감은 보통(3.0/2.96)인 반면 &lt;b&gt;보급 시 수용의향은 압도적&lt;/b&gt;(4.45/5, 99%)으로, &#x27;인지·접근성&#x27;이 핵심 병목임을 시사한다.
국민은 R&amp;D의 &lt;b&gt;중요성·투자필요성엔 압도적 동의&lt;/b&gt;(4.8/4.71)하되 효과성엔 신중(3.77)하며, 과학기술 역할을 &lt;b&gt;&#x27;예방 단계&#x27;·&#x27;기술 접근성 보급&#x27;&lt;/b&gt;에서 기대한다.
정보는 &lt;b&gt;TV·뉴스 등 전통매체&lt;/b&gt; 의존이 크고, 잠재 위협으로 &lt;b&gt;기후변화·사이버범죄·시설 노후화·고령화&lt;/b&gt;를 꼽았다.
&lt;/div&gt;

&lt;h2&gt;Key Themes&lt;/h2&gt;

&lt;div class=theme&gt;
&lt;h3&gt;Theme 1. 높은 위기의식 ↔ 낮은 기술 인지 (Awareness Gap)&lt;span class=prev&gt;전 응답자&lt;/span&gt;&lt;/h3&gt;
재난 문제엔 민감하나, 그것을 다루는 과학기술의 존재·내용은 거의 모른다.
&lt;div class=ev&gt;· Q5 관심도 &lt;b&gt;3.92&lt;/b&gt;(관심 83%) / Q6 심각성 &lt;b&gt;4.02&lt;/b&gt;(심각 99.6%) &amp;nbsp;vs&amp;nbsp; Q14 R&amp;D 인지도 &lt;b&gt;2.12&lt;/b&gt;(&#x27;모른다&#x27; 84%, &#x27;안다&#x27; 4.1%)&lt;/div&gt;
&lt;div class=impl&gt;→ R&amp;D 성과가 국민 체감으로 연결되지 못함. 인지·소통 격차 해소가 1순위 과제.&lt;/div&gt;
&lt;/div&gt;

&lt;div class=theme&gt;
&lt;h3&gt;Theme 2. 낮은 효과 체감 ↔ 압도적 수용의향 (Adoption Opportunity)&lt;span class=prev&gt;기술 태도 전반&lt;/span&gt;&lt;/h3&gt;
지금 기술이 잘 활용된다고 느끼진 않지만, 보급되면 적극 쓰겠다는 의향은 매우 높다.
&lt;div class=ev&gt;· Q20 활용도 &lt;b&gt;2.96&lt;/b&gt; / Q16 해결가능성 &lt;b&gt;3.03&lt;/b&gt; &amp;nbsp;vs&amp;nbsp; Q21 사용의향 &lt;b&gt;4.45&lt;/b&gt;(그렇다 99%)&lt;/div&gt;
&lt;div class=impl&gt;→ 수요는 충분. 기술개발보다 보급·접근성·체감화가 병목.&lt;/div&gt;
&lt;/div&gt;

&lt;div class=theme&gt;
&lt;h3&gt;Theme 3. R&amp;D 가치엔 압도적 지지, 효과성엔 유보 (Value vs Proof)&lt;span class=prev&gt;R&amp;D 평가 3문항&lt;/span&gt;&lt;/h3&gt;
중요하고 투자도 필요하다는 데엔 강하게 동의하나, 실제 효과엔 상대적으로 신중하다.
&lt;div class=ev&gt;· Q17 중요성 &lt;b&gt;4.80&lt;/b&gt; / Q19 투자필요성 &lt;b&gt;4.71&lt;/b&gt; &amp;nbsp;vs&amp;nbsp; Q18 효과성·기여도 &lt;b&gt;3.77&lt;/b&gt;&lt;/div&gt;
&lt;div class=impl&gt;→ 효과 입증·실증 사례 제시가 신뢰의 다음 단계.&lt;/div&gt;
&lt;/div&gt;

&lt;div class=theme&gt;
&lt;h3&gt;Theme 4. 기술 기대 = &#x27;예방 단계&#x27;·&#x27;접근성 보급&#x27; (Where Tech Should Help)&lt;span class=prev&gt;역할 인식&lt;/span&gt;&lt;/h3&gt;
사후 대응보다 사전 예방에, 첨단성보다 보급·접근성에 과학기술의 역할을 기대한다.
&lt;div class=ev&gt;· Q27 기여 단계: &lt;b&gt;예측·예방 99%&lt;/b&gt; &amp;nbsp;·&amp;nbsp; Q22 핵심요소: &lt;b&gt;기술 접근성·보급 87%&lt;/b&gt;(연구개발 10%) &amp;nbsp;·&amp;nbsp; Q26 기여 기대: &lt;b&gt;화재·감염병·태풍&lt;/b&gt;&lt;/div&gt;
&lt;div class=impl&gt;→ 로드맵 우선순위를 예방형·보급형 기술에 둘 근거.&lt;/div&gt;
&lt;/div&gt;

&lt;div class=theme&gt;
&lt;h3&gt;Theme 5. 전통매체 의존 정보경로 (Channel)&lt;span class=prev&gt;Q15&lt;/span&gt;&lt;/h3&gt;
재난안전 기술 정보를 주로 TV·뉴스에서 접한다.
&lt;div class=ev&gt;· Q15 1순위: &lt;b&gt;TV·라디오 55% / 뉴스포털 31% / SNS 14%&lt;/b&gt; (정부·공공 플랫폼 0.3%)&lt;/div&gt;
&lt;div class=impl&gt;→ 정부·공공 채널 도달 미미. 전통매체·언론 연계 소통 전략 필요.&lt;/div&gt;
&lt;/div&gt;

&lt;div class=theme&gt;
&lt;h3&gt;Theme 6. &#x27;보통+&#x27; 안전감, 잠재위협은 신종복합형 (Emerging Risks)&lt;span class=prev&gt;Q28·Q30&lt;/span&gt;&lt;/h3&gt;
자기 지역은 보통~약간 안전하다 보나, 미래 위협으로 기후·사이버·고령화를 우려한다.
&lt;div class=ev&gt;· Q28 거주지 안전도 &lt;b&gt;3.49&lt;/b&gt; · Q30 빈출: &lt;b&gt;기후변화·국지성호우·사이버/보이스피싱·시설 노후화·고령화&lt;/b&gt;&lt;/div&gt;
&lt;div class=ev q&gt;&quot;최근 기후 변화로 예측 불가능한 국지성 호우나 폭염...&quot; — P(40대)&lt;br&gt;
&quot;고령화와 디지털 기술 발전으로 AI 기반 보이스피싱이나 사이버 테러...&quot; — P(고학력)&lt;br&gt;
&quot;동네가 낡아서 전기·가스 설비 노후화로 인한 화재가 걱정...&quot; — P(저학력)&lt;/div&gt;
&lt;div class=impl&gt;→ 단일재난형을 넘어 기후·디지털·고령사회 복합위험을 선제 관리 대상으로.&lt;/div&gt;
&lt;/div&gt;

&lt;h2&gt;Insights → Opportunities&lt;/h2&gt;
&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Insight (학습)&lt;/th&gt;&lt;th&gt;Opportunity (정책·R&amp;D 기회)&lt;/th&gt;&lt;th&gt;Impact&lt;/th&gt;&lt;th&gt;Effort&lt;/th&gt;&lt;/tr&gt;

&lt;h2&gt;Recommendations&lt;/h2&gt;
&lt;ol&gt;
&lt;li&gt;&lt;b class=hi&gt;[High]&lt;/b&gt; &lt;b&gt;인지격차 해소를 최우선 과제로&lt;/b&gt; — 높은 관심(83%)을 R&amp;D 인지·신뢰로 전환. TV·뉴스 등 실제 도달 채널 활용. &lt;small&gt;(Theme 1·5)&lt;/small&gt;&lt;/li&gt;
&lt;li&gt;&lt;b class=hi&gt;[High]&lt;/b&gt; &lt;b&gt;&#x27;보급·접근성&#x27; 중심 R&amp;D·정책&lt;/b&gt; — 수용의향 99% 확보됨 → 개발보다 전달·체감화에 자원 배분. &lt;small&gt;(Theme 2·4)&lt;/small&gt;&lt;/li&gt;
&lt;li&gt;&lt;b class=hi&gt;[High]&lt;/b&gt; &lt;b&gt;예방형 기술 우선투자&lt;/b&gt; — 기대가 예측·예방에 집중(99%). 조기경보·예측 로드맵 강화. &lt;small&gt;(Theme 4)&lt;/small&gt;&lt;/li&gt;
&lt;li&gt;&lt;b class=me&gt;[Med]&lt;/b&gt; &lt;b&gt;효과 실증·공개로 신뢰 제고&lt;/b&gt; — 중요성(4.8)·효과성(3.77) 간극을 사례로 메움. &lt;small&gt;(Theme 3)&lt;/small&gt;&lt;/li&gt;
&lt;li&gt;&lt;b class=me&gt;[Med]&lt;/b&gt; &lt;b&gt;복합·신종재난 트랙 신설&lt;/b&gt; — 기후·사이버·고령사회 위험. &lt;small&gt;(Theme 6)&lt;/small&gt;&lt;/li&gt;
&lt;/ol&gt;

&lt;h2&gt;Questions for Further Research&lt;/h2&gt;
&lt;ul&gt;
&lt;li&gt;인지도 4%는 실제로도 그렇게 낮은가? (합성은 인지도 과소평가 가능 — 실제조사 교차검증)&lt;/li&gt;
&lt;li&gt;&#x27;수용의향 99%&#x27;는 합성 긍정편향 가능 — 실측 87.7%와 비교 시 과대.&lt;/li&gt;
&lt;li&gt;예방단계 99% 쏠림은 합성 분산소멸 산물 — 실제(55.6%)와 큰 차이, 해석 주의.&lt;/li&gt;
&lt;li&gt;세그먼트별 미세 차이는 통계적으로 유의한가? (합성은 집단차 과소표현)&lt;/li&gt;
&lt;/ul&gt;

;15.기타(다중운집인파사고, 인공우주물체 추락·충돌)&lt;/td&gt;&lt;td class=n&gt;0.8%&lt;/td&gt;&lt;td class=n&gt;0.8%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;18.치안 및 기타&lt;/td&gt;&lt;td class=n&gt;0.4%&lt;/td&gt;&lt;td class=n&gt;0.8%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;h3&gt;Q30. 우리 사회의 잠재적 위험요인 (자유응답) &lt;small&gt;(응답 542건)&lt;/small&gt;&lt;/h3&gt;&lt;p class=mean&gt;빈출 키워드: 기후(201) · 변화로(183) · 잠재적(134) · 날씨가(125) · 걱정됩니다(122) · 사이버(113) · 범죄가(95) · 갑자기(93) · 보이스피싱(91) · 위험요인이라고(81) · 사고가(78) · 예측(77) · 국지성(71) · 불가능한(68) · 기술이(67) · 기상(66) · 혼자(65) · 위험이(64) · 노후화된(59) · 새로운(58)&lt;/p&gt;&lt;ul class=open&gt;&lt;li&gt;요즘 AI 기술이 발달하면서 딥페이크 같은 디지털 성범죄가 많이 발생하고 있는데, 이걸 재난으로 관리해야 할 것 같아요. 그리고 기후변화 때문에 여름 폭염이 너무 심해져서 실외 활동이 불가능해지는 것도 위험요인인 것 같아요.&lt;/li&gt;&lt;li&gt;최근 날씨가 이상해서 여름철에 장마가 오면 동네 저지대가 침수되거나 산사태가 날까 봐 걱정됩니다. 그리고 공장 기계들이 점점 낡아가는데 가스가 새거나 고장 나서 사고가 나지 않을까 하는 불안도 듭니다.&lt;/li&gt;&lt;li&gt;최근 날씨가 너무 덥고 태풍도 자주 온다니, 앞으로 더 큰 홍수나 폭염 같은 게 사람들의 건강을 해치지 않을까 걱정됩니다. 그리고 우리 아파트도 노후화되어서 화재나 가스 사고 같은 게 나면 정말 큰일 날 것 같아요.&lt;/li&gt;&lt;li&gt;기후 변화로 인해 예측하기 힘든 집중호우와 태풍이 점점 강해지고 있어, 이로 인한 도시 침수와 산사태 위험이 가장 걱정됩니다. 또한 노후화된 아파트와 주택 시설에서 발생할 수 있는 가스나 화재 사고도 선제적으로 관리되어야 한다고 생각합니다.&lt;/li&gt;&lt;li&gt;요즘 유튜브나 뉴스에서 보면 AI 기술을 이용한 보이스피싱이나 딥페이크 같은 사이버 범죄가 너무 정교해져서 일반인은 속출 수가 없을 것 같아요. 그리고 우리 동네처럼 오래된 주택이나 상가가 많은 곳은 낡은 전기 배선 때문에 화재가 날까 봐 항상 조심스럽더라고요.&lt;/li&gt;&lt;li&gt;최근 뉴스에서 많이 보는 보이스피싱 같은 범죄 수법이 점차 정교해져서 걸러내기 어려워 보이는 점이 걱정되고, 아이들이 먹는 가공식품에 포함된 미세 플라스틱이나 화학 물질 같은 눈에 보이지 않는 위해 요소들이 위험해 보입니다.&lt;/li&gt;&lt;li&gt;요즘 날씨가 너무 덥거나 비가 갑자기 쏟아져서 농사짓는 데 많은 지장을 주는데, 이런 기상 이변을 미리 알릴 수 있는 기술이 더 있었으면 좋겠습니다. 그리고 우리 동네는 집이 낡고 골목이 좁아서 화재가 나면 소방차가 들어오기 힘든데, 그런 위험을 미리 막을 수 있는 방법도 필요하다고 봅니다.&lt;/li&gt;&lt;li&gt;요즘 기후 변화로 예전보다 장마철 비가 너무 많이 와서 지리산 인근 산사태 위험이 커지는 것 같습니다. 또한 우리 동네는 고령자 분들이 많으셔서 큰 재난이 발생하면 빠르게 대피하기 힘들지도 모른다는 걱정이 듭니다.&lt;/li&gt;&lt;li&gt;기후 변화로 인한 집중호우와 도심 홍수, 그리고 노후화된 아파트 단지의 가스 및 전기 설비 사고가 잠재적 위험요인이라고 생각합니다. 또한, 고령화 사회로 진입함에 따라 의약품 오남용이나 안전 취약계층을 위한 복지 시설의 안전 관리도 중요해질 것 같습니다.&lt;/li&gt;&lt;li&gt;날씨가 점점 이상해져서 태풍이나 폭우 같은 게 예전보다 더 위험해질 것 같고, 요즘 핸드폰으로 하루 종일 뉴스를 보니 AI 딥페이크 같은 기술을 악용한 사기 범죄도 재난급으로 관리가 필요해 보입니다.&lt;/li&gt;&lt;li&gt;고령화와 디지털 기술의 발전으로 인해 AI 기반의 보이스피싱이나 사이버 테러 같은 새로운 형태의 사회재난이 증가할 것입니다. 또한 노후화된 도시 기반시설과 기후 변화에 따른 국지적 호우로 인한 지반 침하 같은 도시형 재난도 정부가 선제적으로 관리해야 할 잠재적 위험요인입니다.&lt;/li&gt;&lt;li&gt;최근 기후 변화로 인한 예측 불가능한 국지성 호우와 폭염이 도시 기반 시설을 견디지 못하고 발생하는 이상 기후 재난이 가장 우려되며, 고령화 사회에서 독거 노인이나 안전 취약 계층을 위한 실질적인 재난 대응 시스템이 부족한 점도 잠재적 위험요인이라고 생각합니다.&lt;/li&gt;&lt;li&gt;최근 기후 변화로 인한 예측 불가능한 폭우나 폭염이, 야외에서 일하는 저와 같은 사람들에게는 가장 큰 잠재적 위험요인으로 다가옵니다. 또한 고령화 사회로 접어들면서 재난 상황 발생 시 대피가 어려운 독거 어르신들에 대한 선제적인 보호 대책도 사회적 차원에서 재난으로 관리되어야 한다고 생각합니다.&lt;/li&gt;&lt;li&gt;최근 기후 변화로 인해 예측하기 힘든 국지성 호우나 폭염이 자주 발생하고 있어서 이에 대한 대비가 시급하다고 생각합니다. 또한, 고령화로 인해 건강 관련 문제가 커지는 만큼 신종 바이러스나 전염병 같은 보건 위험 요인도 재난 차원에서 더 철저히 관리해야 한다고 봅니다.&lt;/li&gt;&lt;li&gt;동네가 낡아서 전기나 가스 설비 노후화로 인한 화재가 걱정되고, 요즘 같은 폭염에는 냉방비 부담도 크고 건강도 해칠까 봐 겁납니다.&lt;/li&gt;&lt;li&gt;최근 기후 변화로 인해 예측하기 힘든 국지성 호우나 폭염 같은 이상 기후 현상이 점점 잦아지고 있어서 이를 새로운 잠재적 위험요인으로 생각합니다. 또한 일상생활에서 빼놓을 수 없는 인공지능이나 IT 기술의 오작동, 혹은 그로 인한 사이버 보안 문제도 앞으로 중요한 위험 요소가 될 것 같아요.&lt;/li&gt;&lt;li&gt;스마트 팩토리와 자동화 시스템의 의존도가 높아짐에 따라, 사이버 테러나 AI 시스템의 오작동으로 인한 대규모 산업 재해 및 정보 유출이 잠재적 위험요인이라고 생각합니다.&lt;/li&gt;&lt;li&gt;요즘 날씨가 이상해서 장마철이 아닌데도 갑자기 폭우가 쏟아져 도로가 침수되거나 산사태가 나는 것이 자주 발생하는데, 이런 기상 이변으로 인한 사고가 더 위험해지는 것 같습니다. 또 요즘은 인터넷과 스마트폰을 이용한 보이스피싱이나 사기가 너무 교묘해져서 정보에 약한 어르신들이 큰 피해를 입는 것도 사회적 재난이라고 생각합니다.&lt;/li&gt;&lt;li&gt;기후 변화로 인한 해안 침수와 같은 지역적 재난 위험 증가와, 현대 사회의 고립감과 스트레스가 초래하는 집단 심리 위기가 향후 중요한 관리 대상이 될 것이라고 생각합니다.&lt;/li&gt;&lt;li&gt;급격한 기후 변화로 인한 예측 불가능한 기상 이변과, 최 developments 인공지능 기술을 악용한 고도화된 사이버 범죄나 딥페이크 같은 신종 범죄가 가장 잠재적인 위험요인이라고 생각합니다.&lt;/li&gt;&lt;/ul&gt;
&lt;h2&gt;교차분석&lt;/h2&gt;&lt;h3&gt;Q14 기술인지 — 연령대&lt;/h3&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;구분&lt;/th&gt;&lt;th&gt;가중평균&lt;/th&gt;&lt;th&gt;n&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;19-29&lt;/td&gt;&lt;td class=n&gt;2.11&lt;/td&gt;&lt;td class=n&gt;88&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;30-39&lt;/td&gt;&lt;td class=n&gt;2.19&lt;/td&gt;&lt;td class=n&gt;105&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;40-49&lt;/td&gt;&lt;td class=n&gt;2.33&lt;/td&gt;&lt;td class=n&gt;107&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;50-59&lt;/td&gt;&lt;td class=n&gt;2.11&lt;/td&gt;&lt;td class=n&gt;128&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;60-69&lt;/td&gt;&lt;td class=n&gt;1.89&lt;/td&gt;&lt;td class=n&gt;114&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;h3&gt;Q16 해결가능성 — 학력&lt;/h3&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;구분&lt;/th&gt;&lt;th&gt;가중평균&lt;/th&gt;&lt;th&gt;n&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;고졸 이하&lt;/td&gt;&lt;td class=n&gt;3.01&lt;/td&gt;&lt;td class=n&gt;272&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;대학교 졸업&lt;/td&gt;&lt;td class=n&gt;3.04&lt;/td&gt;&lt;td class=n&gt;241&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;대학원 졸업&lt;/td&gt;&lt;td class=n&gt;3.16&lt;/td&gt;&lt;td class=n&gt;29&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;h3&gt;Q28 지역안전도 — 지역&lt;/h3&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;구분&lt;/th&gt;&lt;th&gt;가중평균&lt;/th&gt;&lt;th&gt;n&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;서울&lt;/td&gt;&lt;td class=n&gt;3.26&lt;/td&gt;&lt;td class=n&gt;73&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;부산&lt;/td&gt;&lt;td class=n&gt;3.36&lt;/td&gt;&lt;td class=n&gt;35&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;대구&lt;/td&gt;&lt;td class=n&gt;3.45&lt;/td&gt;&lt;td class=n&gt;29&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;인천&lt;/td&gt;&lt;td class=n&gt;3.26&lt;/td&gt;&lt;td class=n&gt;33&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;광주&lt;/td&gt;&lt;td class=n&gt;3.63&lt;/td&gt;&lt;td class=n&gt;27&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;대전&lt;/td&gt;&lt;td class=n&gt;3.68&lt;/td&gt;&lt;td class=n&gt;26&lt;/td& <script>
const PASSWORD_HASH = "f79a285d";
const gate = document.getElementById("gate");
const app = document.getElementById("app");
function hash(value) {
  let h = 2166136261;
  for (const ch of value) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; }
  return h.toString(16).padStart(8, "0");
}
function unlock() { gate.style.display = "none"; app.style.display = "block"; }
if (sessionStorage.getItem("private-report-unlocked") === PASSWORD_HASH) unlock();
document.getElementById("login").addEventListener("submit", (event) => {
  event.preventDefault();
  const value = document.getElementById("password").value;
  if (hash(value) === PASSWORD_HASH) { sessionStorage.setItem("private-report-unlocked", PASSWORD_HASH); unlock(); }
  else { document.getElementById("error").textContent = "비밀번호가 올바르지 않습니다."; }
});
document.querySelectorAll(".tab").forEach((tab) => tab.addEventListener("click", () => {
  document.querySelectorAll(".tab, .report-pane").forEach((el) => el.classList.remove("active"));
  tab.classList.add("active");
  document.getElementById(tab.dataset.target).classList.add("active");
}));
</script>
</body>
</html>
